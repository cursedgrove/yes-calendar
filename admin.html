function openLog({ sid = null, call = null, preset = {} } = {}) {
  const c = call || { student_id: sid, at: ymdhm(new Date()), method: 'in-person', contact: 'student', outcome: 'reached', notes: '', ...preset };
  const studs = M().students.filter(s => s.active !== false || s.id === c.student_id).sort((a, b) => a.name.localeCompare(b.name));
  if (!studs.length) return toast('Add a student first');
  openModal(`<div class="m-head"><h2>${call ? 'Edit check-in' : 'Log a check-in'}</h2><button class="iconbtn" data-x>✕</button></div>
  <div class="m-body">
    <label class="field"><span>Student</span><select id="l_stu">${studs.map(s => `<option value="${s.id}" ${s.id === c.student_id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>
    <div class="row"><label class="field"><span>Date</span><input type="date" id="l_d" value="${c.at.slice(0, 10)}"></label><label class="field"><span>Time</span><input type="time" id="l_t" value="${c.at.slice(11, 16)}"></label></div>
    <div class="field"><span>Outcome</span><div class="outs">${Object.entries(OUT).map(([k, o]) => `<label class="out-opt" style="--c:${o.c}"><input type="radio" name="l_o" value="${k}" ${c.outcome === k ? 'checked' : ''}><span>${o.l}</span></label>`).join('')}</div></div>
  ${call && call.outcome === 'no-show' && !TEAMV() ? `<button class="btn" data-swap style="width:100%">Someone else came in instead...</button>` : ''}
  </div>
  <div class="m-foot">${call ? '<button class="btn danger left" data-del>Delete</button>' : '<span class="left muted sm">Ctrl+Enter saves</span>'}<button class="btn" data-x>Cancel</button><button class="btn primary" data-save>Save</button></div>`, 'sm');
  $('#modal [data-swap]')?.addEventListener('click', () => openSwap(call));
  $$('#modal [data-x]').forEach(b => { b.onclick = () => closeModal(); });
  const save = async () => {
    const body = { student_id: +$('#l_stu').value, at: `${$('#l_d').value}T${$('#l_t').value || '12:00'}`, method: 'in-person', contact: 'student', outcome: $('#modal input[name=l_o]:checked')?.value || 'reached', notes: '' };
    const before = goalN(callsOn(new Date()));
    try { if (call) await api('PUT', 'calls/' + call.id, body); else await api('POST', 'calls', body); } catch (e) { return toast(e.message); }
    closeModal(); await reload();
    if (!call) { const nd = body.outcome === 'reached' ? nextDue(stuById(body.student_id)) : null; toast(`Check-in logged${nd ? ` · next one ${fmtDateShort(nd)}` : ''}`); celebrate(before); }
  };
  $('#modal [data-save]').onclick = save;
  $('#modal').onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); } };
  $('#modal [data-del]')?.addEventListener('click', () => { closeModal(); deleteCall(call.id); });
}

/* ---------- absent today: move them to the next school day, without counting it as a no-show ---------- */
async function markAbsent(sid) {
  const s = stuById(sid); if (!s) return;
  const prev = { nextAt: s.nextAt || '', nextSet: s.nextSet || '', absentOn: s.absentOn || '' };
  const nd = nextOpenDay(new Date());
  await api('PUT', 'students/' + sid, { ...s, nextAt: ymd(nd), nextSet: ymdhm(new Date()), absentOn: ymd(new Date()) });
  await reload();
  toast(`${s.name} is absent today · moved to ${fmtDateShort(nd)}`, { duration: 8000, undo: async () => { await api('PUT', 'students/' + sid, { ...stuById(sid), ...prev }); reload(); } });
}
const absentToday = s => s.absentOn === ymd(new Date());

/* ---------- clicking a "Next:" label on the calendar: who they are, in plain text, and Came in / Didn't ---------- */
function openDueCard(s, day) {
  if (!s) return;
  const sp = v => String(v || '').split(/\s*[\/|]\s*/).map(x => x.trim()).filter(Boolean);
  const per = sp(s.period), cls = sp(s.classes), rm = sp(s.room), tc = sp(s.teacher);
  const lines = per.length ? per.map((p, i) => `${p}${/^\d$/.test(p) ? ({ 1: 'st', 2: 'nd', 3: 'rd' }[p] || 'th') : ''} period${cls[i] ? ' · ' + cls[i] : ''}${rm[i] ? ' · room ' + rm[i] : ''}${tc[i] ? ' · ' + tc[i] : ''}`) : (cls.length ? [cls.join(', ')] : []);
  const lr = lastCall(s.id, c => c.outcome === 'reached'), d = nextDue(s);
  const info = [
    [s.grade ? s.grade + 'th grade' : '', s.idnum ? 'ID ' + s.idnum : ''].filter(Boolean).join(' · '),
    ...lines,
    lr ? `Last came in ${fmtDateShort(parseD(lr.at))}` : 'Hasn\'t come in yet',
    absentToday(s) ? 'Absent today' : '',
    d ? `Scheduled ${fmtDateShort(d)}${s.nextAt ? ' (rescheduled)' : ''}` : '',
    s.notes ? 'Note: ' + s.notes : '',
  ].filter(Boolean);
  const an = adminNote(s);
  openModal(`<div class="m-head"><h2>${esc(s.name)}</h2><button class="iconbtn" data-x>✕</button></div>
  <div class="m-body due-card">${!IS_ADMIN && an ? `<div class="note-box"><b>Note from your admin</b><div>${esc(an.note)}</div><span class="muted sm">${esc(syncWhen(an.updated))}</span></div>` : ''}${info.map(t => `<div>${esc(t)}</div>`).join('')}
  ${IS_ADMIN ? `<label class="field" style="margin-top:8px"><span>Note for ${esc(s.mentor || 'their mentor')} (shows on this student for them)</span><textarea id="an_note" rows="3" maxlength="1000" placeholder="e.g. Talk to him about attendance">${esc(an ? an.note : '')}</textarea></label>
  <div class="row" style="gap:6px">${an ? '<button class="btn" data-nrm>Remove note</button>' : ''}<button class="btn primary" data-nsave>${an ? 'Update note' : 'Pin note'}</button><span class="muted sm" id="an_msg">${an ? 'Pinned ' + esc(syncWhen(an.updated)) : ''}</span></div>` : ''}</div>
  <div class="m-foot">${IS_ADMIN ? '<button class="btn primary" data-x>Close</button>' : `<button class="btn left" data-dabs title="Absent from school today: move to the next school day">Absent today</button><button class="btn" data-dno>Didn't come in</button><button class="btn primary" data-dyes>Came in</button>`}</div>`, 'sm');
  $$('#modal [data-x]').forEach(b => { b.onclick = () => closeModal(); });
  $('#modal [data-dyes]')?.addEventListener('click', () => { closeModal(); quickLog(s.id, 'reached'); });
  $('#modal [data-dno]')?.addEventListener('click', () => { closeModal(); quickLog(s.id, 'no-show'); });
  $('#modal [data-dabs]')?.addEventListener('click', () => { closeModal(); markAbsent(s.id); });
  const nsave = async text => {
    if (!syncOn()) return toast('Sign in with the admin code first.');
    $('#an_msg').textContent = 'Saving...';
    try { await saveAdminNote(s, text); closeModal(); toast(text ? `Note pinned on ${s.name} for ${s.mentor || 'their mentor'}` : 'Note removed'); renderMentor(); }
    catch (e) { $('#an_msg').textContent = e.message; }
  };
  $('#modal [data-nsave]')?.addEventListener('click', () => nsave($('#an_note').value.trim()));
  $('#modal [data-nrm]')?.addEventListener('click', () => nsave(''));
}

/* ---------- a student didn't come in, so another student who's due this week came instead ---------- */
function nextOpenDay(d) { let x = addDays(startOfDay(d), 1); for (let i = 0; i < 60 && !openDay(x); i++) x = addDays(x, 1); return x; }
function openSwap(call) {
  const x = stuById(call.student_id); if (!x) return;
  const day = parseD(call.at), ws = startOfWeek(day), we = addDays(ws, 6), dayKey = ymd(day);
  const wk = M().calls.filter(c => { const k = c.at.slice(0, 10); return k >= ymd(ws) && k <= ymd(we); });
  const loggedToday = new Set(M().calls.filter(c => c.at.slice(0, 10) === dayKey).map(c => c.student_id));
  const dueKey = s => { const d = nextDue(s); return d ? ymd(d) : '0000'; };
  const due = M().students.filter(s => s.active !== false && s.id !== x.id && !loggedToday.has(s.id) && !upToDate(s, we, wk.filter(c => c.student_id === s.id)))
    .sort((a, b) => dueKey(a).localeCompare(dueKey(b)) || a.name.localeCompare(b.name));
  const others = M().students.filter(s => s.active !== false && s.id !== x.id && !due.includes(s)).sort((a, b) => a.name.localeCompare(b.name));
  const per = String(x.period || '').split(/\s*[\/|]\s*/)[0];
  const row = s => { const d = nextDue(s); return `<button type="button" class="sw-pick" data-sw="${s.id}"><b>${esc(s.name)}</b><span class="muted sm">${s.period ? 'P' + esc(s.period) + ' · ' : ''}${d ? (d < startOfDay(day) ? 'overdue since ' : 'due ') + fmtDateShort(d) : 'not seen yet'}</span></button>`; };
  const nd = nextOpenDay(day);
  openModal(`<div class="m-head"><h2>Someone else came instead</h2><button class="iconbtn" data-x>✕</button></div>
  <div class="m-body">
    <p style="margin:0"><b>${esc(x.name)}</b> didn't come in (${DAYS[day.getDay()]} ${fmtTime(day)}). Who did you call in instead? They'll be logged as came in at the same time.</p>
    <input id="sw_q" placeholder="Search all your students..." autocomplete="off">
    <div class="sw-list" id="sw_list"><div class="sw-h">Due this week (${due.length})</div>${due.map(row).join('') || '<div class="muted sm" style="padding:6px">Nobody else is due this week.</div>'}<div class="sw-h">Everyone else</div>${others.map(row).join('')}</div>
    <div class="sw-chosen muted sm" id="sw_chosen">Nobody picked yet.</div>
    <label class="field"><span>New date for ${esc(x.name)}</span><input type="date" id="sw_d" value="${ymd(nd)}"></label>
    <div class="muted sm">Shows on the calendar as "Next: ${esc(x.name)} (rescheduled)" and on the Mentoring tab. It goes back to every 2 weeks once they come in.</div>
  </div>
  <div class="m-foot"><button class="btn left" data-only>Only reschedule ${esc(x.name.split(' ')[0])}</button><button class="btn" data-x>Cancel</button><button class="btn primary" data-sw-save disabled>Save</button></div>`);
  $$('#modal [data-x]').forEach(b => { b.onclick = () => closeModal(); });
  let pick = null;
  $('#sw_q').oninput = e => { const q = e.target.value.trim().toLowerCase(); $$('#sw_list .sw-pick').forEach(b => { b.hidden = q && !b.textContent.toLowerCase().includes(q); }); };
  $('#sw_list').onclick = e => {
    const b = e.target.closest('[data-sw]'); if (!b) return;
    $$('#sw_list .sw-pick').forEach(z => z.classList.toggle('on', z === b));
    pick = stuById(+b.dataset.sw);
    $('#sw_chosen').innerHTML = `<b style="color:var(--text)">${esc(pick.name)}</b> came in instead. Their next pull-out will be 2 weeks after today.`;
    $('#modal [data-sw-save]').disabled = false;
  };
  const resched = async () => {
    const d = $('#sw_d').value;
    if (/^\d{4}-\d{2}-\d{2}$/.test(d)) await api('PUT', 'students/' + x.id, { ...x, nextAt: d, nextSet: ymdhm(new Date()) });
    return d;
  };
  $('#modal [data-only]').onclick = async () => { const d = await resched(); closeModal(); await reload(); toast(`${x.name} rescheduled for ${fmtDateShort(parseD(d))}`); };
  $('#modal [data-sw-save]').onclick = async () => {
    if (!pick) return;
    const before = goalN(callsOn(new Date()));
    const made = await api('POST', 'calls', { student_id: pick.id, at: call.at, method: 'in-person', contact: 'student', outcome: 'reached', notes: '' });
    const d = await resched();
    closeModal(); await reload();
    const pn = nextDue(stuById(pick.id));
    toast(`${pick.name} came in instead${pn ? ` (next: ${fmtDateShort(pn)})` : ''} · ${x.name} rescheduled for ${fmtDateShort(parseD(d))}`, { duration: 9000, undo: async () => { await api('DELETE', 'calls/' + made.id); await api('PUT', 'students/' + x.id, { ...x, nextAt: '', nextSet: '' }); reload(); } });
    celebrate(before);
  };
}

function openStudent(s) {
  const isNew = !s;
  s = s || { name: '', idnum: '', period: '', classes: '', room: '', teacher: '', phone: '', email: '', every: '', school: M().students.at(-1)?.school || '', grade: '', mentor: M().students.at(-1)?.mentor || (ownView() ? adminName() : ''), notes: '', active: true, flagged: false };
  const hist = isNew ? [] : M().calls.filter(c => c.student_id === s.id).sort((a, b) => b.at.localeCompare(a.at));
  const reached = hist.filter(c => c.outcome === 'reached').length;
  const an = isNew ? null : adminNote(s);
  openModal(`<div class="m-head"><h2>${isNew ? 'Add student' : esc(s.name)}</h2><button class="iconbtn" data-x>✕</button></div>
  <div class="m-body">
    ${an ? `<div class="note-box"><b>Note from your admin</b><div>${esc(an.note)}</div><span class="muted sm">${esc(syncWhen(an.updated))}</span></div>` : ''}
    <div class="row"><label class="field" style="flex:2"><span>Name</span><input id="s_name" value="${esc(s.name)}" autofocus></label><label class="field" style="flex:1"><span>Grade</span><select id="s_grade"><option value=""></option>${[...(String(s.grade) === '6' ? ['6'] : []), '7', '8', '9', '10', '11', '12'].map(g => `<option ${String(s.grade) === g ? 'selected' : ''}>${g}</option>`).join('')}</select></label></div>
    <div class="row"><label class="field" style="flex:1"><span>Student ID</span><input id="s_idnum" value="${esc(s.idnum || '')}"></label><label class="field" style="flex:1"><span>Pull-out period(s)</span><input id="s_period" value="${esc(s.period || '')}" placeholder="ex: 3/6"></label></div>
    <label class="field"><span>Class(es) to pull from</span><input id="s_classes" value="${esc(s.classes || '')}" placeholder="ex: DSLR Photography / Guitar"></label>
    <div class="row"><label class="field" style="flex:1"><span>Room(s)</span><input id="s_room" value="${esc(s.room || '')}" placeholder="ex: 106 / 700"></label><label class="field" style="flex:2"><span>Teacher(s)</span><input id="s_teacher" value="${esc(s.teacher || '')}"></label></div>
    <div class="row"><label class="field" style="flex:1"><span>Phone</span><input id="s_phone" type="tel" value="${esc(s.phone)}"></label><label class="field" style="flex:1"><span>Email</span><input id="s_email" type="email" value="${esc(s.email)}"></label></div>
    <div class="row"><label class="field" style="flex:1"><span>School</span><input id="s_school" value="${esc(s.school)}" list="schools"></label><label class="field" style="flex:1"><span>Mentor</span><input id="s_mentor" value="${esc(s.mentor)}" list="mentors"></label></div>
    <datalist id="schools">${[...new Set(M().students.map(x => x.school).filter(Boolean))].map(x => `<option value="${esc(x)}">`).join('')}</datalist>
    <datalist id="mentors">${[...new Set(M().students.map(x => x.mentor).filter(Boolean))].map(x => `<option value="${esc(x)}">`).join('')}</datalist>
    <label class="field"><span>Call in every ___ days (blank = ${mset().everyDays}, your default)</span><input id="s_every" type="number" min="1" max="90" value="${esc(s.every || '')}" style="width:110px"></label>
    <label class="field"><span>Notes</span><textarea id="s_notes" placeholder="">${esc(s.notes)}</textarea></label>
    <div class="row"><label class="row" style="gap:6px"><input type="checkbox" id="s_flag" ${s.flagged ? 'checked' : ''}> Needs follow up</label><label class="row" style="gap:6px"><input type="checkbox" id="s_active" ${s.active !== false ? 'checked' : ''}> Active</label></div>
    ${isNew ? '' : `<div class="field"><span>History: pulled out ${hist.length} time${hist.length === 1 ? '' : 's'}, came in ${reached}${nextDue(s) ? ` · next check-in ${fmtDateShort(nextDue(s))}${dueText(nextDue(s)) !== fmtDateShort(nextDue(s)) ? ` (${dueText(nextDue(s))})` : ''}` : ''}</span><div class="hist">${hist.map(c => `<div><b>${fmtDateShort(parseD(c.at))} ${fmtTime(parseD(c.at))}</b> · <span class="ob" style="--c:${OUT[c.outcome]?.c}">${OUT[c.outcome]?.l}</span></div>`).join('') || '<span class="muted sm">Nothing yet</span>'}</div></div>`}
  </div>
  <div class="m-foot">${isNew ? '' : '<button class="btn danger left" data-del>Delete</button><button class="btn" data-sched>Schedule check-in</button><button class="btn" data-log>Log check-in</button>'}<button class="btn" data-x>Cancel</button><button class="btn primary" data-save>Save</button></div>`, 'lg');
  $$('#modal [data-x]').forEach(b => { b.onclick = () => closeModal(); });
  const body = () => ({ name: $('#s_name').value, grade: $('#s_grade').value, phone: $('#s_phone').value, idnum: $('#s_idnum').value, period: $('#s_period').value, classes: $('#s_classes').value, room: $('#s_room').value, teacher: $('#s_teacher').value, email: $('#s_email').value, school: $('#s_school').value, mentor: $('#s_mentor').value, every: $('#s_every').value, notes: $('#s_notes').value, flagged: $('#s_flag').checked, active: $('#s_active').checked });
  const save = async () => {
    if (!$('#s_name').value.trim()) return toast('Enter a name');
    try { if (isNew) await api('POST', 'students', body()); else await api('PUT', 'students/' + s.id, body()); } catch (e) { return toast(e.message); }
    closeModal(); await reload(); toast(isNew ? 'Student added' : 'Saved');
  };
  $('#modal [data-save]').onclick = save;
  $('#modal').onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey || e.target.tagName === 'INPUT')) { e.preventDefault(); save(); } };
  $('#modal [data-log]')?.addEventListener('click', () => { closeModal(); openLog({ sid: s.id }); });
  $('#modal [data-sched]')?.addEventListener('click', () => { closeModal(); scheduleCall(s); });
  $('#modal [data-del]')?.addEventListener('click', async () => {
    if (!(await confirmBox(`Delete ${s.name}?`, `This removes the student and their <b>${hist.length}</b> logged contact${hist.length === 1 ? '' : 's'}. To keep their history, uncheck <b>Active</b> instead.`))) return;
    await api('DELETE', 'students/' + s.id); await reload(); toast('Student deleted');
  });
}

function openRoster(keepSel) {
  const list = M().students.slice().sort((a, b) => (+(b.active !== false) - +(a.active !== false)) || a.name.localeCompare(b.name));
  // picking students: one or many, then change or delete them together
  const sel = new Set((keepSel || []).filter(id => list.some(s => s.id === id)));
  const editable = s => !s.src;   // a mentor's own students; the admin's team copies change on the mentor's calendar
  const FIELDS = [['grade', 'Grade'], ['period', 'Period'], ['classes', 'Class'], ['room', 'Room'], ['teacher', 'Teacher'], ['school', 'School'], ['mentor', 'Mentor'], ['every', 'Call in every ___ days']];
  const rowsHTML = () => `${list.map(s => { const lr = lastCall(s.id, c => c.outcome === 'reached'); return `<tr data-rs="${s.id}" class="${sel.has(s.id) ? 'rs-on' : ''}" style="${s.active === false ? 'opacity:.5' : ''}"><td class="rs-ck"><input type="checkbox" data-rsck ${sel.has(s.id) ? 'checked' : ''} aria-label="Select ${esc(s.name)}"></td><td>${s.flagged ? '<span class="flag">(!)</span> ' : ''}${esc(s.name)}${s.active === false ? ' <span class="muted sm">(inactive)</span>' : ''}</td><td>${esc(s.grade)}</td><td>${esc(s.idnum || '')}</td><td>${esc(s.period || '')}</td><td>${esc(s.classes || '')}</td><td>${esc(s.room || '')}</td><td>${esc(s.teacher || '')}</td><td>${esc(s.mentor)}</td><td>${lr ? relDay(lr.at) : '<span class="muted">never</span>'}</td><td>${nextDue(s) ? dueSpan(nextDue(s)).replace('next: ', '') : '<span class="muted">now</span>'}</td></tr>`; }).join('') || '<tr><td colspan="11" class="muted">No students yet</td></tr>'}`;
  openModal(`<div class="m-head"><h2>Roster (${list.length})</h2><button class="iconbtn" data-x>✕</button></div>
  <div class="m-body">
    <div class="row rs-bar" style="gap:8px;flex-wrap:wrap;align-items:center">
      <span class="muted sm">Select:</span><button class="linkbtn sm" data-rsall>All</button><button class="linkbtn sm" data-rsact>Active</button><button class="linkbtn sm" data-rsinact>Inactive</button><button class="linkbtn sm" data-rsnone>None</button>
      <span id="rs_n" class="sm" style="margin-left:6px"></span>
    </div>
    <div class="rs-actions" id="rs_actions" hidden>
      <button class="btn sm" data-rsedit title="Open this student">Open</button>
      <button class="btn sm" data-rsoff>Mark inactive</button><button class="btn sm" data-rson>Mark active</button>
      <button class="btn sm" data-rsflag>Priority on/off</button>
      <span class="rs-change"><select id="rs_field">${FIELDS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select><input id="rs_val" placeholder="New value" list="rs_vals"><datalist id="rs_vals"></datalist><button class="btn sm" data-rsset>Change</button></span>
      <button class="btn sm" data-rscsv>Export selected</button>
      <button class="btn sm danger" data-rsdel>Delete</button>
      <div class="muted sm" id="rs_note"></div>
    </div>
    <table class="roster-table"><thead><tr><th class="rs-ck"><input type="checkbox" id="rs_head" aria-label="Select all"></th><th>Name</th><th>Grade</th><th>ID</th><th>Period</th><th>Class</th><th>Room</th><th>Teacher</th><th>Mentor</th><th>Last came in</th><th>Next</th></tr></thead><tbody>
  ${rowsHTML()}
  </tbody></table></div>
  <div class="m-foot"><button class="btn left" data-csv>Export roster (.csv)</button><button class="btn" data-imp>Import</button><button class="btn primary" data-add>Add student</button></div>`, 'lg');
  $$('#modal [data-x]').forEach(b => { b.onclick = () => closeModal(); });
  const chosen = () => list.filter(s => sel.has(s.id));
  const vals = () => { const k = $('#rs_field').value; $('#rs_vals').innerHTML = [...new Set(M().students.map(s => String(s[k] || '')).filter(Boolean))].sort().slice(0, 60).map(v => `<option value="${esc(v)}">`).join(''); };
  const paint = () => {
    $$('#modal tbody tr[data-rs]').forEach(tr => { const on = sel.has(+tr.dataset.rs); tr.classList.toggle('rs-on', on); const c = tr.querySelector('[data-rsck]'); if (c) c.checked = on; });
    const n = sel.size, ro = chosen().filter(s => !editable(s)).length;
    $('#rs_n').textContent = n ? `${n} selected` : '';
    $('#rs_actions').hidden = !n;
    $('#modal [data-rsedit]').hidden = n !== 1;
    $('#rs_note').textContent = ro ? `${ro} of these ${ro === 1 ? 'is' : 'are'} on a mentor's own calendar, so only Export works for ${ro === 1 ? 'it' : 'them'} here.` : '';
    const h = $('#rs_head'); h.checked = n > 0 && n === list.length; h.indeterminate = n > 0 && n < list.length;
  };
  vals(); paint();
  $('#rs_field').onchange = vals;
  const pick = f => { sel.clear(); list.filter(f).forEach(s => sel.add(s.id)); paint(); };
  $('#modal [data-rsall]').onclick = () => pick(() => true);
  $('#modal [data-rsact]').onclick = () => pick(s => s.active !== false);
  $('#modal [data-rsinact]').onclick = () => pick(s => s.active === false);
  $('#modal [data-rsnone]').onclick = () => pick(() => false);

function openCoverage() {
  const list = M().students.filter(s => s.active !== false);
  const calls = M().calls, today = startOfDay(new Date()), thisWk = startOfWeek(today);
  const first = calls.map(c => c.at).sort()[0];

  if (dayDiff(start, thisWk) > 7 * 26) start = addDays(thisWk, -7 * 26);   // at most half a year
  const weeks = []; for (let w = start; w <= thisWk; w = addDays(w, 7)) weeks.push(w);
  const cell = new Map();   // sid|week -> 'came' | 'tried'
  for (const c of calls) {
    const k = c.student_id + '|' + ymd(startOfWeek(parseD(c.at)));
    if (c.outcome === 'reached') cell.set(k, 'came'); else if (!cell.has(k)) cell.set(k, 'tried');
  }
  const weekClosed = w => [...Array(7)].map((_, i) => addDays(w, i)).filter(d => d.getDay() % 6).every(d => closedOn(d));
  const awayM = new Map(awayList(list, calls).map(x => [x.s.id, x]));

  const sorts = {

    name: (a, b) => a.name.localeCompare(b.name),
    mentor: (a, b) => (a.mentor || '').localeCompare(b.mentor || '') || a.name.localeCompare(b.name),
    least: (a, b) => seenWeeks(a) - seenWeeks(b) || a.name.localeCompare(b.name),
  };
  const openW = weeks.filter(w => !weekClosed(w));
  const draw = (sortBy) => {
    const rows = list.slice().sort(sorts[sortBy]);
    const head = weeks.map(w => `<th class="${weekClosed(w) ? 'cv-closed' : ''} ${sameDay(w, thisWk) ? 'cv-now' : ''}" title="Week of ${fmtDateShort(w)}">${MONTHS_S[w.getMonth()]}<br>${w.getDate()}</th>`).join('');
    const body = rows.map(s => {

      return `<tr data-cvs="${s.id}"><th class="cv-name"><b>${esc(s.name)}</b>${IS_ADMIN && !S.mmentor && s.mentor ? `<span class="muted sm"> · ${esc(s.mentor)}</span>` : ''}<div class="sm ${aw ? 'cv-away' : 'muted'}">${aw ? (aw.at ? 'not seen in ' + awayText(aw) : 'never came in') : `seen ${n} of ${openW.length} weeks`}</div></th>${weeks.map(w => {
        const v = cell.get(s.id + '|' + ymd(w)), cl = weekClosed(w);
        return `<td class="cv ${v ? 'cv-' + v : cl ? 'cv-closed' : ''}" title="${esc(s.name)} · week of ${fmtDateShort(w)}: ${v === 'came' ? 'came in' : v === 'tried' ? "pulled, didn't come in" : cl ? 'IYT room closed' : 'no pull-out'}"></td>`;
      }).join('')}</tr>`;
    }).join('');
    const foot = `<tr class="cv-foot"><th class="cv-name">Seen that week</th>${weeks.map(w => { const n = rows.filter(s => cell.get(s.id + '|' + ymd(w)) === 'came').length, p = rows.length ? Math.round(n / rows.length * 100) : 0; return `<td title="${n} of ${rows.length} students came in">${weekClosed(w) ? '' : p + '%'}</td>`; }).join('')}</tr>`;
    $('#cvWrap').innerHTML = `<table class="cv-tbl"><thead><tr><th class="cv-name">Student</th>${head}</tr></thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table>`;
    const w = $('#cvWrap'); w.scrollLeft = w.scrollWidth;
  };
  openModal(`<div class="m-head"><h2>Coverage${S.mmentor ? ' · ' + esc(S.mmentor) : IS_ADMIN ? ' · everyone' : ''} <span class="muted" style="font-size:14px">(${list.length} students, ${weeks.length} weeks)</span></h2><button class="iconbtn" data-x>✕</button></div>
  <div class="m-body"><div class="row" style="gap:12px;flex-wrap:wrap;margin-bottom:8px"><label class="row" style="gap:6px">Sort <select id="cvSort"><option value="gap">Longest since seen</option><option value="least">Fewest weeks seen</option><option value="name">Name</option>${IS_ADMIN && !S.mmentor ? '<option value="mentor">Mentor</option>' : ''}</select></label>
    <span class="cv-key"><i class="cv-came"></i>came in <i class="cv-tried"></i>pulled, didn't come in <i></i>no pull-out <i class="cv-closed"></i>room closed</span></div>
    ${list.length ? '<div id="cvWrap" class="cv-wrap"></div>' : '<p class="muted">No students to show.</p>'}</div>
  <div class="m-foot"><button class="btn left" data-cvcsv>Download (.csv)</button><button class="btn primary" data-x>Done</button></div>`, 'lg cv-modal');
  $$('#modal [data-x]').forEach(b => { b.onclick = () => closeModal(); });

}

function reportStats(name, a, b) {
  const today = startOfDay(new Date()), endC = b < today ? b : today;
  const studs = Mall().students.filter(s => s.mentor === name && s.active !== false), ids = new Set(studs.map(s => s.id));
  const all = Mall().calls.filter(c => ids.has(c.student_id));
  const inR = all.filter(c => { const d = c.at.slice(0, 10); return d >= ymd(a) && d <= ymd(b); });
  const came = inR.filter(c => c.outcome === 'reached');
  const days = []; for (let d = startOfDay(a); d <= endC; d = addDays(d, 1)) if (openDay(d)) days.push(ymd(d));
  const perDay = new Map(days.map(d => [d, 0])); for (const c of came) { const k = c.at.slice(0, 10); if (perDay.has(k)) perDay.set(k, perDay.get(k) + 1); }
  const goalDay = new Map(days.map(d => [d, 0])); for (const k of new Set(inR.filter(countsGoal).map(c => c.at.slice(0, 10) + '|' + c.student_id))) { const d = k.slice(0, 10); if (goalDay.has(d)) goalDay.set(d, goalDay.get(d) + 1); }
  const seen = new Set(came.map(c => c.student_id));
  // days between visits, per student, over all history up to the end of the period
  const gaps = [];
  for (const s of studs) {
    const v = all.filter(c => c.student_id === s.id && c.outcome === 'reached' && c.at.slice(0, 10) <= ymd(b)).map(c => c.at.slice(0, 10)).sort();
    for (let i = 1; i < v.length; i++) if (v[i] >= ymd(a)) gaps.push(dayDiff(parseD(v[i - 1]), parseD(v[i])));
  }
  const goal = teamGoal(name).dailyGoal;
  const weeks = Math.max(1, days.length / 5);
  const ls = lastSeenMap(all.filter(c => c.at.slice(0, 10) <= ymd(b)));
  const rows = studs.map(s => {
    const mine = inR.filter(c => c.student_id === s.id), c1 = mine.filter(c => c.outcome === 'reached').length, last = ls.get(s.id), nd = nextDue(s);
    const away = last ? (openDaysSince(last) >= AWAY_DAYS) : true;
    return { s, came: c1, missed: mine.length - c1, last, nd, away };
  }).sort((x, y) => (x.last || '').localeCompare(y.last || '') || x.s.name.localeCompare(y.s.name));
  const bestDay = [...perDay.entries()].sort((x, y) => y[1] - x[1])[0];
  return {
    name, students: studs.length, pulls: inR.length, came: came.length, missed: inR.length - came.length,
    rate: inR.length ? came.length / inR.length : null, seen: seen.size, coverage: studs.length ? seen.size / studs.length : null,
    days: days.length, perDayAvg: days.length ? came.length / days.length : null, perWeekAvg: came.length / weeks,
    perStudent: studs.length ? came.length / studs.length : null, gap: gaps.length ? gaps.reduce((x, y) => x + y, 0) / gaps.length : null,
    goal, goalDays: goal ? days.filter(d => goalDay.get(d) >= goal).length : null,
    away: rows.filter(r => r.away).length, upToDate: studs.filter(s => { const d = nextDue(s); return d && d > today; }).length,
    perDay, bestDay, rows,
  };
}

// per mentor, week by week: students who came in (each student once a day), against the goal
function ovMentorStats(n, weeks) {

  const calls = Mall().calls.filter(c => ids.has(c.student_id)), came = calls.filter(c => c.outcome === 'reached');
  const per = weeks.map(w => { const a = ymd(w), b = ymd(addDays(w, 6)); return new Set(came.filter(c => { const d = c.at.slice(0, 10); return d >= a && d <= b; }).map(c => c.student_id + '|' + c.at.slice(0, 10))).size; });
  const today = ymd(new Date()), d14 = ymd(addDays(new Date(), -14)), d21 = ymd(addDays(new Date(), -21));
  const lastCame = new Map(); for (const c of came) { const d = c.at.slice(0, 10); if (d <= today && (!lastCame.has(c.student_id) || d > lastCame.get(c.student_id))) lastCame.set(c.student_id, d); }
  const seen14 = st.filter(s => (lastCame.get(s.id) || '') >= d14).length, gone21 = st.filter(s => (lastCame.get(s.id) || '') < d21).length;
  const g = teamGoal(n).weeklyGoal || 0, done = per.slice(0, -1), avg = done.length ? Math.round(done.reduce((a, b) => a + b, 0) / done.length * 10) / 10 : 0;
  return { n, students: st.length, per, goal: g, avg, seen14, gone21, metWeeks: g ? done.filter(x => x >= g).length : null, last: calls.map(c => c.at).sort().pop() || '' };
}

function colorOutcome(c) {
  if (!c) return null;
  const [r, g, b] = c;
  if (r > 0.95 && g > 0.95 && b > 0.95) return null;          // white = not marked
  if (b >= r && b >= g) return null;                             // light blue headers
  if (g > r + 0.08 && g > b) return g < 0.5 && r < 0.3 ? 'label' : 'reached';   // green (dark green = day label)
  if (r > g + 0.1) return b < g - 0.08 ? 'reached' : 'no-show';  // orange = came in (left early), red = didn't

}

      const fs = Math.hypot(i.transform[2], i.transform[3]) || i.height || 4, x = i.transform[4], yb = top - i.transform[5];
      return { text: i.str.replace(/\s+/g, ' ').trim(), x0: x, x1: x + i.width, top: yb - fs, bottom: yb, cx: x + i.width / 2, cy: yb - fs / 2 };
    });

        if (mm && mm.length >= 4 && isFinite(mm[0])) {

}
function analyzePdf(pages) {

    .sort((a, b) => (a.x1 - a.x0) * (a.bottom - a.top) - (b.x1 - b.x0) * (b.bottom - b.top))[0];
  // mentor name: the value under the "Mentor" label
  for (const pg of pages) {
    const lab = pg.items.find(i => /^mentor$/i.test(i.text));
    if (lab) { const v = pg.items.filter(i => i.cy > lab.cy + 2 && i.cy < lab.cy + 30 && Math.abs(i.cx - lab.cx) < 25).sort((a, b) => a.cy - b.cy)[0]; if (v) out.mentor = v.text; break; }
  }
  // roster table
  let cols = null, startPage = -1;
  for (let p = 0; p < pages.length && !cols; p++) {
    const pg = pages[p], first = pg.items.find(i => /^first( name)?$/i.test(i.text));
    if (!first) continue;
    const last = pg.items.find(i => /^last( name)?$/i.test(i.text) && Math.abs(i.cy - first.cy) < 2);
    if (!last) continue;
    const hdr = pg.items.filter(i => Math.abs(i.cy - first.cy) < 2.5 && i.cx > first.cx - 120).sort((a, b) => a.cx - b.cx);
    const merged = [];
    for (const h of hdr) { const cell = cellOf(pg, h, 200); const prev = merged[merged.length - 1]; if (prev && cell && prev.cell && prev.cell === cell) prev.text += ' ' + h.text; else merged.push({ text: h.text, cx: h.cx, cell }); }
    cols = merged.map((h, i) => {
      const L = h.cell ? h.cell.x0 : (i ? (merged[i - 1].cx + h.cx) / 2 : h.cx - 15), R = h.cell ? h.cell.x1 : (i < merged.length - 1 ? (h.cx + merged[i + 1].cx) / 2 : h.cx + 15);
      return { name: h.text, x0: L, x1: R };
    });
    cols.headerBottom = Math.max(...hdr.map(h => h.bottom)); startPage = p;
  }
  if (cols) {
    const fc = cols.find(c => /^first/i.test(c.name)), rows = [cols.map(c => c.name)];
    for (let p = startPage; p < pages.length; p++) {
      const pg = pages[p], minTop = p === startPage ? cols.headerBottom : 0;
      const bands = [];
      for (const r of pg.rects.filter(r => r.top >= minTop - 0.5 && r.x0 <= (fc.x0 + fc.x1) / 2 && r.x1 >= (fc.x0 + fc.x1) / 2 && r.bottom - r.top > 2 && r.bottom - r.top < 60).sort((a, b) => a.top - b.top)) {
        if (!bands.length || r.top >= bands[bands.length - 1].bottom - 0.5) bands.push({ top: r.top, bottom: r.bottom });
      }
      for (const b of bands) {
        const vals = cols.map(c => pg.items.filter(i => i.cx >= c.x0 && i.cx <= c.x1 && i.cy >= b.top && i.cy <= b.bottom).sort((a, b2) => a.cy - b2.cy || a.cx - b2.cx).map(i => i.text).join(' ').replace(/\t/g, ' '));
        if (vals.some(v => v)) rows.push(vals);
      }
    }
    out.rosterTSV = rows.map(r => r.join('\t')).join('\n');
  }
  // calendar: every text item gets the date of the day-header above it and the color of its cell
  let prevCols = [], lastYear = 0, lastMonth = 0;
  pages.forEach((pg, pi) => {
    const heads = [];
    for (const it of pg.items) {
      const t = it.text.replace(PL_WEEKDAY, '').trim();
      const m = it.text.match(PL_DATE);
      if (m && /^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(t)) { heads.push({ cx: it.cx, top: it.top, date: plDate(m), it }); lastYear = +plDate(m).slice(0, 4); lastMonth = +m[1]; continue; }

      if (s && lastYear && +s[1] >= 1 && +s[1] <= 12 && +s[2] >= 1 && +s[2] <= 31) {
        const y = lastMonth && +s[1] < lastMonth - 6 ? lastYear + 1 : lastYear;
        heads.push({ cx: it.cx, top: it.top, date: `${y}-${pad(+s[1])}-${pad(+s[2])}`, it });
      }
    }
    const hs = new Set(heads.map(h => h.it));

  }
  SY.planLoaded ||= new Set();
  let changed = false;
  for (const p of SY.planners) {
    if (p.uses || !(p.roster || []).length) continue;
    if (realNames.has(p.name)) { SY.planLoaded.delete(p.name); continue; }
    // someone helping (Abel with Daisy's kids) already synced these students: don't show them twice
    const helped = Mall().students.some(s => s.src && s.src.toLowerCase() !== p.name.toLowerCase() && (s.mentor || '').toLowerCase() === p.name.toLowerCase());
    if (helped) { if (Mall().students.some(s => s.src === p.name)) { await api('POST', 'team-clear', { from: p.name }); changed = true; } SY.planLoaded.delete(p.name); continue; }
    if (SY.planLoaded.has(p.name) && Mall().students.some(s => s.src === p.name)) continue;

function switchPerson(name, prevName) {
  const k = x => String(x || '').trim().toLowerCase();

  store.set(OWNER_KEY(), name);
  if (!cur || k(cur) === k(name)) return false;

  const keep = { db: DB, keys: {} };
  for (const key of PERSON_KEYS()) { keep.keys[key] = store.get(key) || ''; store.set(key, ''); }
  try { localStorage.setItem(LS_KEY + '@' + k(cur), JSON.stringify(keep)); } catch { /* full: their data is still on the team Sheet */ }
  let mine = null;

async function importMentorTab(name, site) {

/* ======================================================================== recurrence */
function nthWeekday(y, m, wd, n) {
  if (n > 0) {
    const day = 1 + ((wd - new Date(y, m, 1).getDay() + 7) % 7) + (n - 1) * 7;
    return day <= daysIn(y, m) ? new Date(y, m, day) : null;
  }
  const last = new Date(y, m, daysIn(y, m));
  return addDays(last, -((last.getDay() - wd + 7) % 7));
}
function* iterDates(base, rr) {
  const iv = Math.max(1, +rr.interval || 1);
  if (rr.freq === 'daily') { let d = base; for (;;) { yield d; d = addDays(d, iv); } }
  if (rr.freq === 'weekly') {
    const days = [...new Set((rr.byday && rr.byday.length ? rr.byday : [base.getDay()]).map(Number))].sort((a, b) => a - b);
    let ws = addDays(base, -base.getDay());
    for (;;) { for (const wd of days) { const d = addDays(ws, wd); if (d >= base) yield d; } ws = addDays(ws, 7 * iv); }
  }
  if (rr.freq === 'monthly') {
    const nth = rr.monthly === 'nth';
    let n = Math.floor((base.getDate() - 1) / 7) + 1; if (n === 5) n = -1;
    for (let k = 0; k < 100000; k++) {
      const t = new Date(base.getFullYear(), base.getMonth() + k * iv, 1), y = t.getFullYear(), m = t.getMonth();
      const d = nth ? nthWeekday(y, m, base.getDay(), n) : (base.getDate() <= daysIn(y, m) ? new Date(y, m, base.getDate()) : null);
      if (d && d >= base) yield d;
    }
    return;
  }
  if (rr.freq === 'yearly') {
    for (let k = 0; k < 100000; k++) {
      const y = base.getFullYear() + k * iv;
      if (base.getDate() <= daysIn(y, base.getMonth())) yield new Date(y, base.getMonth(), base.getDate());
    }
    return;
  }
  yield base;
}
function occurrences(ev, rs, re) {
  const base = parseD(ev.start.slice(0, 10)), span = dayDiff(base, parseD(ev.end.slice(0, 10)));
  const mk = d => {
    const start = ev.all_day ? d : parseD(ymd(d) + ev.start.slice(10));
    const end = ev.all_day ? addDays(d, span + 1) : parseD(ymd(addDays(d, span)) + ev.end.slice(10));
    return { ev, start, end, allDay: ev.all_day, date: ymd(d), key: ev.id + '|' + ymd(d) };
  };
  const out = [];
  if (!ev.rrule) { if (base <= re && addDays(base, span) >= rs) out.push(mk(base)); return out; }
  const rr = ev.rrule, until = rr.until ? parseD(rr.until) : null, count = +rr.count || 0, ex = new Set(ev.exdates || []);
  let n = 0;
  for (const d of iterDates(base, rr)) {
    n++;
    if ((count && n > count) || (until && d > until) || d > re || n > 50000) break;
    if (addDays(d, span) >= rs && !ex.has(ymd(d))) out.push(mk(d));
  }
  return out;
}
function rruleText(ev) {
  const rr = ev.rrule; if (!rr) return '';
  const b = parseD(ev.start), iv = +rr.interval || 1;
  let t;
  if (rr.freq === 'daily') t = iv > 1 ? `Every ${iv} days` : 'Daily';
  else if (rr.freq === 'weekly') {
    const days = rr.byday?.length ? rr.byday : [b.getDay()];
    const names = days.join() === '1,2,3,4,5' ? 'weekdays' : days.map(x => DAYS[x]).join(', ');
    t = (iv > 1 ? `Every ${iv} weeks` : 'Weekly') + ` on ${names}`;
  } else if (rr.freq === 'monthly') {
    const n = Math.floor((b.getDate() - 1) / 7) + 1;
    t = (iv > 1 ? `Every ${iv} months` : 'Monthly') + (rr.monthly === 'nth' ? ` on the ${n === 5 ? 'last' : ORD[n]} ${DAYS_L[b.getDay()]}` : ` on day ${b.getDate()}`);
  } else t = (iv > 1 ? `Every ${iv} years` : 'Annually') + ` on ${MONTHS[b.getMonth()]} ${b.getDate()}`;
  if (rr.until) t += `, until ${fmtDateShort(parseD(rr.until))}`;
  else if (rr.count) t += `, ${rr.count} times`;
  return t;
}

/* holidays (US) */
function holidaysForYear(y) {
  const nth = (m, wd, n) => nthWeekday(y, m, wd, n);
  return [[new Date(y, 0, 1), "New Year's Day"], [nth(0, 1, 3), 'Martin Luther King Jr. Day'], [new Date(y, 1, 14), "Valentine's Day"],
    [nth(1, 1, 3), "Presidents' Day"], [nth(4, 0, 2), "Mother's Day"], [nth(4, 1, -1), 'Memorial Day'], [nth(5, 0, 3), "Father's Day"],
    [new Date(y, 5, 19), 'Juneteenth'], [new Date(y, 6, 4), 'Independence Day'], [nth(8, 1, 1), 'Labor Day'],
    [nth(9, 1, 2), "Indigenous Peoples' Day"], [new Date(y, 9, 31), 'Halloween'], [new Date(y, 10, 11), 'Veterans Day'],
    [nth(10, 4, 4), 'Thanksgiving'], [new Date(y, 11, 24), 'Christmas Eve'], [new Date(y, 11, 25), 'Christmas Day'], [new Date(y, 11, 31), "New Year's Eve"]];
}
function holidayOccs(rs, re) {
  const out = [];
  for (let y = rs.getFullYear(); y <= re.getFullYear(); y++) {
    for (const [d, name] of holidaysForYear(y)) {
      if (d < rs || d > re) continue;
      const ev = { id: 'hol-' + ymd(d), title: name, holiday: true, all_day: true, calendar_id: null, start: ymd(d), end: ymd(d),
        color: '', rrule: null, exdates: [], reminders: [], checklist: [], location: '', description: 'US holiday', status: 'free' };
      out.push({ ev, start: d, end: addDays(d, 1), allDay: true, date: ymd(d), key: ev.id });
    }
  }
  return out;
}

function occsInRange(rs, re, { includeHidden = false, holidays = true } = {}) {
  const vis = new Set(S.calendars.filter(c => includeHidden || c.visible).map(c => c.id));
  const all = [];
  for (const ev of S.events) if (vis.has(ev.calendar_id) && annVisible(ev)) all.push(...occurrences(ev, rs, re));
  if (holidays && S.settings.holidays) all.push(...holidayOccs(rs, re));
  if (holidays) all.push(...checkinOccs(rs, re));
  all.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
  for (const o of all) S.occ.set(o.key, o);
  return all;
}
function occOnDay(o, d) {
  const ds = startOfDay(d), de = addDays(ds, 1);
  return o.start < de && (o.end > ds || (+o.end === +o.start && o.start >= ds));
}
const isAllDayish = o => o.allDay || (o.end - o.start) >= 86400000;
const tasksDue = d => S.tasks.filter(t => t.due === ymd(d) && !(t.done && S.settings.declutter));
function busyMinutes(occs, d) {
  const ds = startOfDay(d), de = addDays(ds, 1);
  const iv = occs.filter(o => !isAllDayish(o) && !o.ev.holiday && o.ev.status !== 'free' && o.start < de && o.end > ds)
    .map(o => [Math.max(o.start, ds), Math.min(o.end, de)]).sort((a, b) => a[0] - b[0]);
  let tot = 0, cs = null, ce = null;
  for (const [s, e] of iv) {
    if (cs === null || s > ce) { if (cs !== null) tot += ce - cs; cs = s; ce = e; } else ce = Math.max(ce, e);
  }
  if (cs !== null) tot += ce - cs;
  return tot / 60000;
}

  }
  if (cur.length) groups.push(cur);
  for (const grp of groups) {
    const cols = [];

  }
}

    return { di, min, colW };
  };
  colsEl.addEventListener('pointerdown', e => {
    S.lastPointer = e.pointerType;
    if (e.button !== 0 || e.pointerType === 'touch') return;
    const evEl = e.target.closest('.tev');
    const p0 = pos(e);
    e.preventDefault();
    colsEl.setPointerCapture(e.pointerId);
    let moved = false, p = p0, ghost = null;
    const o = evEl ? S.occ.get(evEl.dataset.key) : null;
    const resize = e.target.classList.contains('rz');
    const onMove = ev => {
      p = pos(ev);
      if (!moved && Math.hypot(ev.clientX - e.clientX, ev.clientY - e.clientY) < 5) return;
      if (!moved) { moved = true; S.dragging = true; closePopover(); }
      if (o) {
        evEl.classList.add('dragging');
        if (resize) {
          const sMin = sameDay(o.start, days[p0.di]) ? minutesOf(o.start) : 0;
          const endMin = Math.max(sMin + 15, (o.end >= addDays(days[p0.di], 1) ? 1440 : minutesOf(o.end)) + (p.min - p0.min));
          evEl.style.height = ((endMin - sMin) * HOUR / 60 - 2) + 'px';
          evEl.querySelector('.tm').textContent = `${fmtTime(o.start)} – ${fmtTime(addMin(o.end, p.min - p0.min))}`;
        } else {
          evEl.style.transform = `translate(${(p.di - p0.di) * p.colW}px, ${(p.min - p0.min) * HOUR / 60}px)`;
          const ns = addMin(addDays(o.start, p.di - p0.di), p.min - p0.min);
          evEl.querySelector('.tm').textContent = `${fmtTime(ns)} – ${fmtTime(new Date(+ns + (o.end - o.start)))}`;
        }
      } else {
        if (!ghost) { ghost = document.createElement('div'); ghost.className = 'tev ghost'; colsEl.children[p0.di].appendChild(ghost); }
        const a = Math.min(p0.min, p.min), b = Math.max(p0.min, p.min, a + 15);
        ghost.style.cssText = `top:${a * HOUR / 60}px;height:${(b - a) * HOUR / 60}px;left:2px;right:2px`;
        const d = days[p0.di];
        ghost.innerHTML = `<b>(New event)</b><span class="tm">${fmtTime(addMin(d, a))} – ${fmtTime(addMin(d, b))}</span>`;
      }
    };
    const onUp = () => {
      colsEl.removeEventListener('pointermove', onMove);
      colsEl.removeEventListener('pointerup', onUp);
      colsEl.removeEventListener('pointercancel', onUp);
      S.dragging = false;
      if (o) {
        if (!moved) return showPopover(o, evEl);
        if (o.ev.holiday || o.ev.gcal_id) return render();
        if (resize) {
          const ne = addMin(o.end, p.min - p0.min);
          return moveOcc(o, o.start, ne > addMin(o.start, 15) ? ne : addMin(o.start, 15));
        }
        const dd = p.di - p0.di, dm = p.min - p0.min;
        if (!dd && !dm) return render();
        return moveOcc(o, addMin(addDays(o.start, dd), dm), addMin(addDays(o.end, dd), dm));
      }
      ghost?.remove();
      const d = days[p0.di];
      if (!moved) {
        const st = addMin(d, Math.floor(Math.min(p0.min, 1425) / 30) * 30);
        return openEditor({ start: st, end: addMin(st, +S.settings.defaultDuration || 60) });
      }
      const a = Math.min(p0.min, p.min), b = Math.max(p0.min, p.min, a + 15);
      openEditor({ start: addMin(d, a), end: addMin(d, b) });
    };
    colsEl.addEventListener('pointermove', onMove);
    colsEl.addEventListener('pointerup', onUp);
    colsEl.addEventListener('pointercancel', onUp);
  });
  // touch: tap to open / create (scrolling stays native)
  colsEl.addEventListener('click', e => {
    if (S.lastPointer !== 'touch') return;
    const evEl = e.target.closest('.tev');
    if (evEl) return showPopover(S.occ.get(evEl.dataset.key), evEl);
    const p = pos(e), st = addMin(days[p.di], Math.floor(p.min / 30) * 30);
    openEditor({ start: st, end: addMin(st, +S.settings.defaultDuration || 60) });
  });
}

  const w = el.offsetWidth, h = el.offsetHeight, vw = innerWidth, vh = innerHeight;

  if (left < 8) left = Math.max(8, Math.min(vw - w - 8, rect.left + rect.width / 2 - w / 2));
  let top = Math.min(Math.max(8, rect.top), vh - h - 8);

/* ======================================================================== changes, scope, undo */
const EVENT_FIELDS = ['calendar_id', 'title', 'start', 'end', 'all_day', 'location', 'description', 'color', 'rrule', 'exdates', 'reminders', 'checklist', 'parent_id', 'orig_date', 'status', 'starred'];
const pickEvent = ev => { const o = {}; for (const k of EVENT_FIELDS) o[k] = clone(ev[k] ?? null); return o; };

async function tx(label, fn) {
  const log = [];
  const t = {
    post: async d => { const r = await api('POST', 'events', d); log.push({ op: 'post', id: r.id }); return r; },
    put: async (id, d) => { const orig = S.events.find(e => e.id === id); log.push({ op: 'put', id, orig: clone(orig) }); return api('PUT', 'events/' + id, d); },
    del: async id => {
      for (const ch of S.events.filter(e => e.parent_id === id)) log.push({ op: 'del', orig: clone(ch) });
      log.push({ op: 'del', orig: clone(S.events.find(e => e.id === id)) });
      return api('DELETE', 'events/' + id);
    },
  };
  try { await fn(t); }
  catch (e) { toast(e.message); await reload(); return false; }
  await reload();
  toast(label, {
    undo: async () => {
      const map = {};
      for (const l of log.slice().reverse()) {
        if (l.op === 'post') await api('DELETE', 'events/' + l.id).catch(() => {});
        else if (l.op === 'put') await api('PUT', 'events/' + l.id, l.orig).catch(() => {});
        else if (l.orig) {
          const d = pickEvent(l.orig);
          if (d.parent_id && map[d.parent_id]) d.parent_id = map[d.parent_id];
          const r = await api('POST', 'events', d); map[l.orig.id] = r.id;
        }
      }
      await reload(); toast('Undone');
    },
  });
  return true;
}
function askScope(title) {
  return new Promise(res => {
    openModal(`<div class="m-head"><h2>${esc(title)}</h2></div><div class="m-body"><div class="scope-opts">
      <label><input type="radio" name="scope" value="this" checked> This event</label>
      <label><input type="radio" name="scope" value="following"> This and following events</label>
      <label><input type="radio" name="scope" value="all"> All events</label></div></div>
      <div class="m-foot"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>OK</button></div>`, 'sm');
    S.modalResolve = res;
    $('#modal [data-x]').onclick = () => closeModal();
    $('#modal [data-ok]').onclick = () => { const v = $('#modal input[name=scope]:checked').value; S.modalResolve = null; closeModal(); res(v); };
    setTimeout(() => $('#modal [data-ok]').focus(), 30);
  });
}
function confirmBox(title, msg, ok = 'Delete') {
  return new Promise(res => {
    openModal(`<div class="m-head"><h2>${esc(title)}</h2></div><div class="m-body"><p style="margin:0">${msg}</p></div><div class="m-foot"><button class="btn" data-x>Cancel</button><button class="btn ${ok === 'Delete' ? 'danger' : 'primary'}" data-ok>${esc(ok)}</button></div>`, 'sm');

}
async function applyScoped(t, occ, scope, data) {
  const ev = occ.ev, baseDate = ev.start.slice(0, 10);
  if (scope === 'following' && occ.date === baseDate) scope = 'all';
  if (scope === 'this') {
    await t.post({ ...data, rrule: null, exdates: [], parent_id: ev.id, orig_date: occ.date });
    await t.put(ev.id, { ...pickEvent(ev), exdates: [...ev.exdates, occ.date] });
    return;
  }
  if (scope === 'all') {
    const shiftD = dayDiff(parseD(occ.date), parseD(data.start.slice(0, 10)));
    const span = dayDiff(parseD(data.start.slice(0, 10)), parseD(data.end.slice(0, 10)));
    const nsd = ymd(addDays(parseD(baseDate), shiftD)), ned = ymd(addDays(parseD(nsd), span));
    let rr = data.rrule;
    if (rr && shiftD && rr.freq === 'weekly' && rr.byday?.length && JSON.stringify(rr.byday) === JSON.stringify(ev.rrule?.byday))
      rr = { ...rr, byday: [...new Set(rr.byday.map(x => ((x + shiftD) % 7 + 7) % 7))].sort() };
    await t.put(ev.id, {
      ...data, rrule: rr, parent_id: null, orig_date: null,
      start: data.all_day ? nsd : nsd + data.start.slice(10), end: data.all_day ? ned : ned + data.end.slice(10),
      exdates: shiftD ? ev.exdates.map(x => ymd(addDays(parseD(x), shiftD))) : ev.exdates,
    });
    return;
  }
  const occD = parseD(occ.date);
  let before = 0;
  if (ev.rrule.count) for (const d of iterDates(parseD(baseDate), ev.rrule)) { if (d >= occD || before > 50000) break; before++; }
  await t.put(ev.id, { ...pickEvent(ev), rrule: { ...ev.rrule, until: ymd(addDays(occD, -1)), count: 0 } });
  const rr = data.rrule ? { ...data.rrule } : null;
  if (rr && rr.count) rr.count = Math.max(1, rr.count - before);
  await t.post({ ...data, rrule: rr, parent_id: null, orig_date: null, exdates: ev.exdates.filter(x => x >= occ.date) });
}
async function moveOcc(o, ns, ne) {
  const ev = o.ev;
  if (ev.holiday) return render();
  if (ev.dueFor || ev.gradeDue || ev.closedRange || ev.gcal_id) return render();
  if (ev.checkin) { await api('PUT', 'calls/' + ev.callId, { at: ymdhm(ns) }); await reload(); return toast('Check-in moved'); }
  const data = { ...pickEvent(ev), start: o.allDay ? ymd(ns) : ymdhm(ns), end: o.allDay ? ymd(addDays(ne, -1)) : ymdhm(ne) };
  if (!ev.rrule) return tx('Event moved', t => t.put(ev.id, data));
  const scope = await askScope('Move repeating event');
  if (!scope) return render();
  return tx('Event moved', t => applyScoped(t, o, scope, data));
}
async function deleteOcc(o) {
  const ev = o.ev; closePopover();
  if (!ev.rrule) return tx('Event deleted', t => t.del(ev.id));
  const scope = await askScope('Delete repeating event');
  if (!scope) return;
  await tx('Event deleted', async t => {
    if (scope === 'all' || (scope === 'following' && o.date === ev.start.slice(0, 10))) await t.del(ev.id);
    else if (scope === 'this') await t.put(ev.id, { ...pickEvent(ev), exdates: [...ev.exdates, o.date] });
    else await t.put(ev.id, { ...pickEvent(ev), rrule: { ...ev.rrule, until: ymd(addDays(parseD(o.date), -1)), count: 0 } });
  });
}

  const t24 = d => hm(d);

  <div class="m-body">

/* ======================================================================== search */
function runSearch(q) {
  const box = $('#searchResults');
  q = q.trim().toLowerCase();
  if (!q) { box.hidden = true; return; }
  const now = new Date();
  const evs = S.events.filter(e => (e.title + ' ' + e.location + ' ' + e.description).toLowerCase().includes(q)).map(e => {
    const o = nextOccurrence(e, now, 5) || occurrences(e, parseD(e.start), parseD(e.end))[0];
    return { e, o };
  }).filter(x => x.o).sort((a, b) => Math.abs(a.o.start - now) - Math.abs(b.o.start - now)).slice(0, 25);
  const tasks = S.tasks.filter(t => (t.title + ' ' + t.notes).toLowerCase().includes(q)).slice(0, 10);
  if (!evs.length && !tasks.length) { box.innerHTML = '<div class="muted" style="padding:10px">No matches</div>'; box.hidden = false; return; }
  box.innerHTML = evs.map(({ e, o }, i) => { S.occ.set(o.key, o); return `<div class="sr-item ${i === 0 ? 'sel' : ''}" data-sr="${esc(o.key)}"><span class="dot" style="--c:${evColor(e)}"></span><div><b>${esc(e.title)}</b><span class="muted sm">${fmtDateShort(o.start)}${o.start.getFullYear() !== now.getFullYear() ? ' ' + o.start.getFullYear() : ''}${o.allDay ? '' : ' · ' + fmtTime(o.start)}${e.rrule ? ' · ↻' : ''}${e.location ? ' · ' + esc(e.location) : ''}</span></div></div>`; }).join('') +
    tasks.map(t => `<div class="sr-item" data-srtask="${t.id}"><span>${t.done ? '☑' : '☐'}</span><div><b>${esc(t.title)}</b><span class="muted sm">Task${t.due ? ' · due ' + fmtDateShort(parseD(t.due)) : ''}</span></div></div>`).join('');
  box.hidden = false;
}
function openSearchResult(el) {
  $('#searchResults').hidden = true; $('#searchInput').blur();
  if (el.dataset.srtask) return openTask(S.tasks.find(t => t.id === +el.dataset.srtask));
  gotoOcc(S.occ.get(el.dataset.sr));
}
function gotoOcc(o) {
  if (!o) return;
  S.cursor = startOfDay(o.start);
  if (S.view === 'year' || S.view === 'agenda') S.view = 'week';
  render();
  const key = o.key;
  setTimeout(() => {
    const el = $(`#main [data-key="${CSS.escape(key)}"]`);
    if (el) { el.scrollIntoView({ block: 'center' }); showPopover(S.occ.get(key), el); }
  }, 30);
}

/* ======================================================================== insights */
function showInsights(mode = 'week') {
  const [rs, re] = mode === 'week' ? [startOfWeek(S.cursor), addDays(startOfWeek(S.cursor), 6)] : [new Date(S.cursor.getFullYear(), S.cursor.getMonth(), 1), new Date(S.cursor.getFullYear(), S.cursor.getMonth() + 1, 0)];
  const occs = occsInRange(rs, re, { holidays: false });
  const per = new Map(), perDay = new Map(), perWd = Array(7).fill(0);
  let total = 0, count = 0, longest = null;
  for (const o of occs) {
    count++;
    if (isAllDayish(o) || o.ev.status === 'free') continue;
    const s = Math.max(o.start, rs), e = Math.min(o.end, addDays(re, 1));
    const min = Math.max(0, (e - s) / 60000);
    total += min;
    per.set(o.ev.calendar_id, (per.get(o.ev.calendar_id) || 0) + min);
    perDay.set(ymd(o.start), (perDay.get(ymd(o.start)) || 0) + min);
    perWd[o.start.getDay()] += min;
    if (!longest || min > longest.min) longest = { o, min };
  }
  const nDays = dayDiff(rs, re) + 1;
  const busiest = [...perDay.entries()].sort((a, b) => b[1] - a[1])[0];
  const doneTasks = S.tasks.filter(t => t.done_at && parseD(t.done_at) >= rs && parseD(t.done_at) < addDays(re, 1)).length;
  const freeDays = [...Array(nDays)].map((_, i) => addDays(rs, i)).filter(d => !perDay.get(ymd(d))).length;
  const max = Math.max(1, ...per.values());
  const bars = mode === 'week'
    ? [...Array(7)].map((_, i) => { const d = addDays(rs, i), v = perDay.get(ymd(d)) || 0; return { l: DAYS[d.getDay()], v }; })
    : [...Array(7)].map((_, i) => { const wd = (i + (+S.settings.weekStart || 0)) % 7; return { l: DAYS[wd], v: perWd[wd] }; });
  const bmax = Math.max(1, ...bars.map(b => b.v));
  openModal(`<div class="m-head"><h2>Time insights</h2><button class="iconbtn" data-x>✕</button></div>
  <div class="m-body">
    <div class="row" style="justify-content:space-between"><div class="ins-tabs"><button class="btn ${mode === 'week' ? 'primary' : ''}" data-m="week">Week</button><button class="btn ${mode === 'month' ? 'primary' : ''}" data-m="month">Month</button></div>
      <span class="muted">${fmtDateShort(rs)} – ${fmtDateShort(re)}</span></div>
    <div class="ins-stats">
      <div class="ins-stat"><div class="v">${fmtDur(total) || '0m'}</div><div class="l">Scheduled</div></div>
      <div class="ins-stat"><div class="v">${count}</div><div class="l">Events</div></div>
      <div class="ins-stat"><div class="v">${freeDays}</div><div class="l">Open days</div></div>
      <div class="ins-stat"><div class="v">${doneTasks}</div><div class="l">Tasks done</div></div>
    </div>
    <div class="field"><span>Time by calendar</span>${[...per.entries()].sort((a, b) => b[1] - a[1]).map(([id, v]) => { const c = calById(id); return `<div class="bar-row" style="--c:${c?.color}"><span>${esc(c?.name || '?')}</span><div class="track"><div class="fill" style="width:${v / max * 100}%"></div></div><span class="val">${fmtDur(v)} · ${Math.round(v / Math.max(1, total) * 100)}%</span></div>`; }).join('') || '<span class="muted">No timed events in this range.</span>'}</div>
    <div class="field"><span>${mode === 'week' ? 'Hours per day' : 'Hours by weekday'}</span><div class="daybars">${bars.map(b => `<div class="b" title="${fmtDur(b.v)}"><span>${b.v ? (b.v / 60).toFixed(1) : ''}</span><div style="height:${b.v / bmax * 85}%"></div>${b.l}</div>`).join('')}</div></div>
    <div class="muted sm">${busiest ? `Busiest day: <b>${fmtDateLong(parseD(busiest[0]))}</b> (${fmtDur(busiest[1])}). ` : ''}${longest ? `Longest event: <b>${esc(longest.o.ev.title)}</b> (${fmtDur(longest.min)}). ` : ''}Average ${fmtDur(total / nDays) || '0m'} per day.</div>
  </div>`, 'lg');
  $$('#modal [data-x]').forEach(b => { b.onclick = () => closeModal(); });
  $$('#modal [data-m]').forEach(b => { b.onclick = () => showInsights(b.dataset.m); });
}

/* ======================================================================== misc helpers */
function toast(msg, { undo = null, duration = 6000 } = {}) {
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button>Undo</button>' : ''}`;
  if (undo) el.querySelector('button').onclick = () => { el.remove(); undo(); };
  $('#toasts').appendChild(el);
  while ($('#toasts').children.length > 2) $('#toasts').firstChild.remove();
  setTimeout(() => el.remove(), duration);
}
function copyText(t) {
  (navigator.clipboard?.writeText(t) || Promise.reject()).then(() => toast('Copied')).catch(() => { prompt('Copy this link:', t); });
}
function downloadText(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function singleICS(o) {
  const ev = o.ev, f = d => o.allDay ? ';VALUE=DATE:' + ymd(d).replace(/-/g, '') : ':' + ymdhm(d).replace(/[-:]/g, '') + '00';
  const e = s => (s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Yes Calendar//EN', 'BEGIN:VEVENT', `UID:orbit-${ev.id}-${o.date}@orbit-calendar`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`, 'DTSTART' + f(o.start), 'DTEND' + f(o.end),
    'SUMMARY:' + e(ev.title), ev.location ? 'LOCATION:' + e(ev.location) : '', ev.description ? 'DESCRIPTION:' + e(ev.description) : '',
    'END:VEVENT', 'END:VCALENDAR'].filter(Boolean).join('\r\n');
}

/* local reminders (while a tab is open) */
function checkLocalReminders() {
  if (!S.user) return;
  const now = new Date();
  let fired = {};
  try { fired = JSON.parse(store.get('orbit.fired') || '{}'); } catch { /* ignore */ }
  for (const ev of S.events) {
    if (!ev.reminders?.length || !calById(ev.calendar_id)?.visible) continue;
    const span = Math.ceil(Math.max(...ev.reminders) / 1440) + 1;
    for (const o of occurrences(ev, addDays(startOfDay(now), -1), addDays(startOfDay(now), span))) {
      const st = o.allDay ? new Date(o.start.getFullYear(), o.start.getMonth(), o.start.getDate(), 9) : o.start;
      for (const m of ev.reminders) {
        const fire = addMin(st, -m), k = o.key + '|' + m;
        if (fire <= now && now - fire < 5 * 60000 && !fired[k]) {
          fired[k] = Date.now();
          const body = (o.allDay ? 'All day' : `${fmtTime(o.start)} – ${fmtTime(o.end)}`) + (ev.location ? ` · ${ev.location}` : '');

  $('#sidebar').addEventListener('click', async e => {
    const mini = e.target.closest('[data-mini]');
    if (mini) { S.mini = new Date(S.mini.getFullYear(), S.mini.getMonth() + +mini.dataset.mini, 1); renderMini(); return; }
    const g = e.target.closest('#mini [data-goto]');
    if (g) { closeSidebar(); goDate(parseD(g.dataset.goto)); return; }
    const ec = e.target.closest('[data-editcal]');
    if (ec) { e.preventDefault(); openCalendar(calById(+ec.dataset.editcal)); return; }
    const occEl = e.target.closest('[data-occ]');
    if (occEl) { closeSidebar(); gotoOcc(S.occ.get(occEl.dataset.occ)); return; }
    if (e.target.id === 'toggleDone') { S.showDone = !S.showDone; renderTasks(); return; }
    const tc = e.target.closest('[data-tcheck]');
    if (tc) { e.preventDefault(); toggleTask(+tc.dataset.tcheck); return; }
    const t = e.target.closest('[data-task]');
    if (t) openTask(S.tasks.find(x => x.id === +t.dataset.task));
  });
  $('#calList').addEventListener('change', async e => {
    const row = e.target.closest('[data-cal]'); if (!row) return;
    const c = calById(+row.dataset.cal); c.visible = e.target.checked; render();
    try { await api('PUT', 'calendars/' + c.id, { visible: c.visible }); } catch (err) { toast(err.message); }
  });

  // main area clicks
  $('#main').addEventListener('click', e => {
    if (S.dragging) return;
    const tc = e.target.closest('[data-tcheck]'); if (tc) { toggleTask(+tc.dataset.tcheck); return; }
    const tchip = e.target.closest('[data-taskchip],[data-task]'); if (tchip) { openTask(S.tasks.find(x => x.id === +(tchip.dataset.taskchip || tchip.dataset.task))); return; }
    const more = e.target.closest('[data-more]'); if (more) { showDayList(more.dataset.more, more); return; }
    const g = e.target.closest('[data-goto]'); if (g) { goDate(parseD(g.dataset.goto), 'day'); return; }
    const mh = e.target.closest('[data-month]'); if (mh) { goDate(new Date(S.cursor.getFullYear(), +mh.dataset.month, 1), 'month'); return; }
    const k = e.target.closest('.chip[data-key], .ag-item[data-key]'); if (k) { showPopover(S.occ.get(k.dataset.key), k); return; }
    const cell = e.target.closest('.mcell');
    if (cell && e.target === cell) { const d = parseD(cell.dataset.date), st = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 9); openEditor({ start: st }); return; }
    const adc = e.target.closest('.adcol');
    if (adc && e.target === adc) openEditor({ start: parseD(adc.dataset.date), allDay: true });
  });

  // popover dismiss
  document.addEventListener('mousedown', e => {
    const p = $('#popover');
    if (!p.hidden && !p.contains(e.target) && !e.target.closest('[data-key],.tev,[data-more]')) closePopover();
    if (!e.target.closest('.search')) $('#searchResults').hidden = true;
  });

  // quick add
  const qi = $('#quickInput');
  qi.oninput = () => { $('#quickPreview').innerHTML = qi.value.trim() ? quickPreview(parseQuick(qi.value)) : ''; };
  qi.onkeydown = async e => {
    if (e.key === 'Escape') { qi.value = ''; qi.oninput(); qi.blur(); return; }
    if (e.key !== 'Enter' || !qi.value.trim()) return;
    e.preventDefault();
    const q = parseQuick(qi.value);
    if (q.kind === 'task') { await addTask(qi.value); toast('Task added'); }
    else if (e.shiftKey) openEditor({ start: q.start, end: q.allDay ? q.end : q.end, allDay: q.allDay, preset: { title: q.title, location: q.location, rrule: q.rrule, calendar_id: q.cal?.id } });
    else { const ok = await tx('Event added', t => t.post(quickToEvent(q))); if (ok && !viewIncludes(q.start)) goDate(q.start); }
    qi.value = ''; qi.oninput();
  };
  $('#taskInput').onkeydown = async e => {
    if (e.key === 'Enter' && e.target.value.trim()) { const v = e.target.value; e.target.value = ''; await addTask(v); }
  };

  // search
  const si = $('#searchInput');
  si.oninput = () => runSearch(si.value);
  si.onfocus = () => { if (si.value) runSearch(si.value); };
  si.onkeydown = e => {
    const items = $$('#searchResults .sr-item'); let i = items.findIndex(x => x.classList.contains('sel'));
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[i]?.classList.remove('sel'); i = Math.max(0, Math.min(items.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1))); items[i]?.classList.add('sel'); items[i]?.scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'Enter' && items[Math.max(0, i)]) openSearchResult(items[Math.max(0, i)]);
    else if (e.key === 'Escape') { si.value = ''; $('#searchResults').hidden = true; si.blur(); }
  };
  $('#searchResults').onclick = e => { const it = e.target.closest('.sr-item'); if (it) openSearchResult(it); };

  // keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!$('#modalWrap').hidden) closeModal(); else closePopover(); return; }
    const tag = (e.target.tagName || '').toLowerCase();
    if (['input', 'textarea', 'select'].includes(tag) || e.ctrlKey || e.metaKey || e.altKey || !$('#modalWrap').hidden || $('#app').hidden) return;
    if ((e.key === 'Delete' || e.key === 'Backspace') && S.popOcc && !S.popOcc.ev.holiday && !S.popOcc.ev.gcal_id) { e.preventDefault(); deleteOcc(S.popOcc); return; }
    if (e.key.toLowerCase() === 'e' && S.popOcc && !S.popOcc.ev.holiday && !S.popOcc.ev.gcal_id) { e.preventDefault(); openEditor({ occ: S.popOcc }); return; }
    const map = {
      t: goToday, j: () => shift(1), n: () => shift(1), arrowright: () => shift(1), k: () => shift(-1), p: () => shift(-1), arrowleft: () => shift(-1),
      d: () => setView('day'), w: () => setView('week'), m: () => setView('month'), y: () => setView('year'), a: () => setView('agenda'),
      c: () => openEditor(), q: () => { $('#app').classList.add('sb-open'); $('#quickInput').focus(); }, '/': () => si.focus(), '?': showShortcuts,
      i: () => showInsights(), s: () => openSettings(), o: () => setView('mentor'), g: jumpPicker,
    };
    const fn = map[e.key.toLowerCase()];
    if (fn) { e.preventDefault(); fn(); }
  });

  // swipe on touch screens
  let tx0 = null;
  $('#main').addEventListener('touchstart', e => { tx0 = e.touches.length === 1 ? [e.touches[0].clientX, e.touches[0].clientY] : null; }, { passive: true });
  $('#main').addEventListener('touchend', e => {
    if (!tx0) return;
    const dx = e.changedTouches[0].clientX - tx0[0], dy = e.changedTouches[0].clientY - tx0[1];
    if (Math.abs(dx) > 70 && Math.abs(dy) < 50) shift(dx < 0 ? 1 : -1);
    tx0 = null;
  }, { passive: true });

  addEventListener('storage', e => { if (e.key === LS_KEY) { DB = loadDB(); reload(); } });
  let rz;
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.view === 'month') render(); }, 150); });
  matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', applyTheme);
  // Re-draws on every new minute (so the red "now" line and "today" stay right) and moves to the new day at midnight.
  // Browsers slow timers down in background tabs and stop them while the computer sleeps, so it also checks
  // whenever the window comes back into view.
  S.lastDay = ymd(new Date());
  const busy = () => S.dragging || ($('#main').contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) || !$('#popover').hidden || !$('#modalWrap').hidden || $('#app').hidden;
  let tickT = null, dayPending = false;
  window.timeTick = () => {
    clearTimeout(tickT);
    const now = new Date(), day = ymd(now);
    if (day !== S.lastDay) {
      // the day changed: if you were looking at the old "today", follow it to the new one
      const [a, b] = viewRange(), old = parseD(S.lastDay);
      if (old >= startOfDay(a) && old <= startOfDay(b)) { S.cursor = startOfDay(now); S.mini = null; }
      S.lastDay = day; dayPending = true;
    }
    if (!busy()) { render(); dayPending = false; }
    else if (dayPending && $('#modalWrap').hidden && $('#popover').hidden) { render(); dayPending = false; }
    tickT = setTimeout(window.timeTick, 60000 - (now.getSeconds() * 1000 + now.getMilliseconds()) + 200);   // next whole minute
  };
  tickT = setTimeout(window.timeTick, 60000 - (new Date().getSeconds() * 1000 + new Date().getMilliseconds()) + 200);
  for (const ev of ['focus', 'pageshow', 'online']) addEventListener(ev, () => window.timeTick());
  document.addEventListener('visibilitychange', () => { if (!document.hidden) window.timeTick(); });
  setInterval(checkLocalReminders, 20000);
  setTimeout(checkLocalReminders, 3000);
  syncInit();
  loginGate();
  if (IS_ADMIN) { S.mmentor = store.get('yes.viewAs.' + LS_KEY) || ''; renderViewAs(); }
  // refresh data when coming back to the tab (keeps devices in sync)
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.user && $('#modalWrap').hidden) reload().catch(() => {}); });
}
function closeSidebar() { $('#app').classList.remove('sb-open'); }
function jumpPicker() {
  const j = $('#jumpDate'); j.value = ymd(S.cursor);
  try { j.showPicker(); } catch { j.focus(); }
}

/* ======================================================================== start */
(async () => {
  try {
    const st = await api('GET', 'status');
    S.version = st.version;
    if (st.user) await boot(); else showAuth(st);
  } catch (e) {
    document.body.innerHTML = `<div style="padding:40px;font-family:sans-serif">Yes Calendar couldn't start: ${esc(e.message)}</div>`;
  }
})();

</script>
</body>
</html>
